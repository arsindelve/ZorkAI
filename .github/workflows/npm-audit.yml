name: NPM Audit

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  npm-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v5

    - name: Setup Node.js
      uses: actions/setup-node@v5
      with:
        node-version: '24'

    # Security gate for the web projects. The single root package-lock.json
    # covers every web workspace (zorkweb.client, planetfallweb.client,
    # shared-web-types), so one root-level audit checks them all. `npm audit`
    # reads the lockfile and queries the registry advisory database directly,
    # so no `npm ci` install step is needed.
    #
    # --audit-level=high fails the build on any high- or critical-severity
    # advisory in PRODUCTION dependencies — the code that actually ships to
    # players. --omit=dev excludes dev tooling (jest, eslint, vite plugins):
    # those chains are currently blanket-flagged by GHSA-mh99-v99m-4gvg
    # (brace-expansion <=5.0.7, a dev-time glob DoS) which has NO patched 1.x
    # release, and forcing 5.x via overrides breaks eslint's minimatch@3
    # (verified: "TypeError: expand is not a function"). Revisit dropping
    # --omit=dev once a 1.x backport lands. The known moderate react-router
    # advisories were fixed in-range on 2026-07-24.
    - name: Audit web dependencies for known vulnerabilities
      run: npm audit --omit=dev --audit-level=high
